<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Collections Method Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <header class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white shadow-lg sticky top-0 z-40">
            <div class="container mx-auto px-4 py-6">
                <h1 class="text-3xl font-bold mb-4">☕ Java Collections Method Library</h1>
                <div class="flex gap-3">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Search methods by name or description..." 
                        class="flex-1 px-4 py-2 rounded-lg text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-300"
                    />
                    <button 
                        id="addMethodBtn" 
                        class="bg-green-500 hover:bg-green-600 px-6 py-2 rounded-lg font-semibold transition"
                    >
                        + Add Method
                    </button>
                </div>
            </div>
        </header>

        <div class="container mx-auto px-4 py-6">
            <div class="mb-6 flex flex-wrap gap-2" id="filterTabs">
                <button class="tab-button active px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300" data-filter="all">
                    All
                </button>
            </div>

            <div id="implementationFilters" class="mb-6 hidden">
                <h3 class="text-sm font-semibold text-gray-600 mb-2">Filter by Implementation:</h3>
                <div class="flex flex-wrap gap-2" id="implementationBadges">
                </div>
            </div>

            <div id="collectionsContainer" class="space-y-8">
            </div>
        </div>
    </div>

    <div id="addMethodModal" class="modal">
        <div class="bg-white rounded-lg shadow-xl p-6 max-w-2xl w-full mx-4">
            <h2 class="text-2xl font-bold mb-4">Add New Method</h2>
            <form id="addMethodForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Collection Type</label>
                    <select id="methodType" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">Select a type...</option>
                        <option value="List">List</option>
                        <option value="Set">Set</option>
                        <option value="Map">Map</option>
                        <option value="Queue">Queue</option>
                        <option value="Deque">Deque</option>
                        <option value="Iterator">Iterator</option>
                        <option value="Collections">Collections</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Origin (Interface or Specific Class)</label>
                    <input type="text" id="methodOrigin" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g., Interface, ArrayList, BlockingQueue">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Method Name</label>
                    <input type="text" id="methodName" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g., add">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Method Signature</label>
                    <input type="text" id="methodSignature" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g., boolean add(E e)">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Return Type</label>
                    <input type="text" id="methodReturnType" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g., boolean">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                    <textarea id="methodDescription" required rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Describe what this method does..."></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Example Code (optional)</label>
                    <textarea id="methodExample" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm" placeholder="e.g., List<String> list = new ArrayList<>();\nlist.add(\"Item\");"></textarea>
                </div>
                <div class="flex gap-3 pt-4">
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-semibold transition">
                        Add Method
                    </button>
                    <button type="button" id="cancelBtn" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded-lg font-semibold transition">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let collectionsData = { collections: [] };
        let currentFilter = 'all';
        let currentImplementationFilter = null;

        const typeColors = {
            'List': 'bg-blue-100 text-blue-800',
            'Set': 'bg-green-100 text-green-800',
            'Map': 'bg-purple-100 text-purple-800',
            'Queue': 'bg-yellow-100 text-yellow-800',
            'Deque': 'bg-orange-100 text-orange-800',
            'Iterator': 'bg-pink-100 text-pink-800',
            'Collections': 'bg-indigo-100 text-indigo-800'
        };

        const originColors = {
            'Interface': 'bg-gray-100 text-gray-800',
            'Utility Class': 'bg-indigo-100 text-indigo-800',
            'ArrayList': 'bg-blue-200 text-blue-900',
            'LinkedList': 'bg-cyan-300 text-cyan-950',
            'Vector': 'bg-blue-300 text-blue-950',
            'Stack': 'bg-blue-400 text-white',
            'HashSet': 'bg-green-200 text-green-900',
            'LinkedHashSet': 'bg-emerald-200 text-emerald-900',
            'TreeSet': 'bg-green-300 text-green-950',
            'NavigableSet': 'bg-teal-300 text-teal-950',
            'HashMap': 'bg-purple-200 text-purple-900',
            'TreeMap': 'bg-purple-300 text-purple-950',
            'Hashtable': 'bg-purple-400 text-white',
            'PriorityQueue': 'bg-yellow-200 text-yellow-900',
            'ArrayDeque': 'bg-orange-200 text-orange-900',
            'CopyOnWriteArrayList': 'bg-blue-500 text-white',
            'CopyOnWriteArraySet': 'bg-green-500 text-white',
            'ConcurrentSkipListSet': 'bg-emerald-500 text-white',
            'BlockingQueue': 'bg-yellow-500 text-yellow-950',
            'TransferQueue': 'bg-yellow-600 text-white',
            'BlockingDeque': 'bg-orange-500 text-white'
        };

        async function loadData() {
            try {
                const response = await fetch('data.json');
                const jsonData = await response.json();
                
                const savedMethods = localStorage.getItem('customMethods');
                if (savedMethods) {
                    const customMethods = JSON.parse(savedMethods);
                    jsonData.collections = mergeCustomMethods(jsonData.collections, customMethods);
                }
                
                collectionsData = jsonData;
                initializeTabs();
                renderImplementationFilters();
                renderCollections();
            } catch (error) {
                console.error('Error loading data:', error);
                collectionsData = { collections: [] };
                renderImplementationFilters();
                renderCollections();
            }
        }

        function mergeCustomMethods(baseCollections, customMethods) {
            const merged = JSON.parse(JSON.stringify(baseCollections));
            
            customMethods.forEach(custom => {
                const collection = merged.find(c => c.type === custom.type);
                if (collection) {
                    collection.methods.push(custom.method);
                } else {
                    merged.push({
                        type: custom.type,
                        implementations: [],
                        methods: [custom.method]
                    });
                }
            });
            
            return merged;
        }

        function initializeTabs() {
            const tabsContainer = document.getElementById('filterTabs');
            const existingTabs = tabsContainer.querySelectorAll('[data-filter]:not([data-filter="all"])');
            existingTabs.forEach(tab => tab.remove());
            
            collectionsData.collections.forEach(collection => {
                const button = document.createElement('button');
                const colorClass = typeColors[collection.type] || 'bg-gray-200 text-gray-800';
                button.className = `tab-button px-4 py-2 rounded-lg ${colorClass}`;
                button.setAttribute('data-filter', collection.type);
                button.textContent = collection.type;
                tabsContainer.appendChild(button);
            });
            
            document.querySelectorAll('.tab-button').forEach(button => {
                button.addEventListener('click', () => {
                    document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
                    button.classList.add('active');
                    currentFilter = button.getAttribute('data-filter');
                    currentImplementationFilter = null;
                    renderImplementationFilters();
                    renderCollections();
                });
            });
        }

        function renderImplementationFilters() {
            const filterContainer = document.getElementById('implementationFilters');
            const badgesContainer = document.getElementById('implementationBadges');
            
            if (currentFilter === 'all') {
                filterContainer.classList.add('hidden');
                return;
            }
            
            const currentCollection = collectionsData.collections.find(c => c.type === currentFilter);
            if (!currentCollection) {
                filterContainer.classList.add('hidden');
                return;
            }
            
            const implementationCounts = {};
            currentCollection.implementations.forEach(impl => {
                implementationCounts[impl] = 0;
            });
            
            currentCollection.methods.forEach(method => {
                const origin = method.origin || 'Interface';
                if (implementationCounts.hasOwnProperty(origin)) {
                    implementationCounts[origin]++;
                }
            });
            
            badgesContainer.innerHTML = '';
            
            currentCollection.implementations.forEach(impl => {
                const count = implementationCounts[impl] || 0;
                if (count === 0) return;
                
                const badge = document.createElement('button');
                const colorClass = originColors[impl] || 'bg-gray-200 text-gray-800';
                badge.className = `implementation-badge px-3 py-2 rounded-lg text-sm font-semibold ${colorClass}`;
                if (currentImplementationFilter === impl) {
                    badge.classList.add('active');
                }
                badge.textContent = `${impl}  (${count}) `;
                badge.addEventListener('click', () => {
                    if (currentImplementationFilter === impl) {
                        currentImplementationFilter = null;
                    } else {
                        currentImplementationFilter = impl;
                    }
                    renderImplementationFilters();
                    renderCollections();
                });
                badgesContainer.appendChild(badge);
            });
            
            if (badgesContainer.children.length > 0) {
                filterContainer.classList.remove('hidden');
            } else {
                filterContainer.classList.add('hidden');
            }
        }

        function renderCollections() {
            const container = document.getElementById('collectionsContainer');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            container.innerHTML = '';
            
            let filteredCollections = collectionsData.collections;
            if (currentFilter !== 'all') {
                filteredCollections = collectionsData.collections.filter(c => c.type === currentFilter);
            }
            
            filteredCollections.forEach(collection => {
                let filteredMethods = collection.methods;
                
                if (currentImplementationFilter) {
                    filteredMethods = filteredMethods.filter(method => 
                        (method.origin || 'Interface') === currentImplementationFilter
                    );
                }
                
                if (searchTerm) {
                    filteredMethods = filteredMethods.filter(method => 
                        method.name.toLowerCase().includes(searchTerm) ||
                        method.signature.toLowerCase().includes(searchTerm) ||
                        method.description.toLowerCase().includes(searchTerm)
                    );
                }
                
                if (filteredMethods.length === 0) return;
                
                const section = document.createElement('div');
                section.className = 'bg-white rounded-lg shadow-md p-6';
                
                const header = document.createElement('div');
                header.className = 'mb-4 pb-3 border-b border-gray-200';
                header.innerHTML = `
                    <h2 class="text-2xl font-bold text-gray-800 mb-2">${collection.type}</h2>
                    <p class="text-sm text-gray-600">Implementations: ${collection.implementations.join(', ')}</p>
                    <p class="text-sm text-gray-500 mt-1">${filteredMethods.length} method${filteredMethods.length !== 1 ? 's' : ''}</p>
                `;
                section.appendChild(header);
                
                const methodsGrid = document.createElement('div');
                methodsGrid.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4';
                
                filteredMethods.forEach((method, idx) => {
                    const card = document.createElement('div');
                    card.className = 'method-card bg-gray-50 border border-gray-200 rounded-lg p-4';
                    const exampleId = `example-${collection.type}-${idx}`;
                    const example = method.example || generateExample(method, collection.type);
                    const origin = method.origin || 'Interface';
                    const originColor = originColors[origin] || 'bg-gray-100 text-gray-800';
                    
                    card.innerHTML = `
                        <div class="flex items-start justify-between mb-2">
                            <div>
                                <h3 class="text-lg font-semibold text-gray-800">${method.name}</h3>
                                <span class="badge ${originColor} text-[10px] py-0 px-2 mt-1">${origin}</span>
                            </div>
                            <span class="badge ${typeColors[collection.type]}">${collection.type}</span>
                        </div>
                        <code class="block text-xs bg-gray-800 text-green-400 p-2 rounded mb-3 overflow-x-auto">
                            ${escapeHtml(method.signature)}
                        </code>
                        <p class="text-sm text-gray-600 mb-2">${escapeHtml(method.description)}</p>
                        <div class="text-xs text-gray-500 mt-2 mb-3">
                            <span class="font-semibold">Returns:</span> <code class="bg-gray-200 px-1 rounded">${escapeHtml(method.returnType)}</code>
                        </div>
                        <div class="border-t border-gray-300 pt-3">
                            <div class="example-toggle flex items-center justify-between text-sm font-semibold text-blue-600 hover:text-blue-800" data-target="${exampleId}">
                                <span>📝 Example</span>
                                <span class="toggle-icon">▼</span>
                            </div>
                            <div id="${exampleId}" class="example-content mt-2">
                                <pre class="text-xs bg-gray-900 text-green-300 p-3 rounded overflow-x-auto"><code>${escapeHtml(example)}</code></pre>
                            </div>
                        </div>
                    `;
                    
                    methodsGrid.appendChild(card);
                });
                
                section.appendChild(methodsGrid);
                container.appendChild(section);
            });
            
            if (container.children.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12">
                        <p class="text-gray-500 text-lg">No methods found matching your search.</p>
                    </div>
                `;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function generateExample(method, collectionType) {
            return `// Example for ${method.name}\n${collectionType} collection = new ${collectionType}<>();\ncollection.${method.name}();`;
        }

        document.getElementById('searchInput').addEventListener('input', () => {
            renderImplementationFilters();
            renderCollections();
        });

        document.addEventListener('click', (e) => {
            if (e.target.closest('.example-toggle')) {
                const toggle = e.target.closest('.example-toggle');
                const targetId = toggle.getAttribute('data-target');
                const content = document.getElementById(targetId);
                const icon = toggle.querySelector('.toggle-icon');
                
                if (content.classList.contains('expanded')) {
                    content.classList.remove('expanded');
                    icon.textContent = '▼';
                } else {
                    content.classList.add('expanded');
                    icon.textContent = '▲';
                }
            }
        });

        const modal = document.getElementById('addMethodModal');
        const addMethodBtn = document.getElementById('addMethodBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const addMethodForm = document.getElementById('addMethodForm');

        addMethodBtn.addEventListener('click', () => {
            modal.classList.add('active');
        });

        cancelBtn.addEventListener('click', () => {
            modal.classList.remove('active');
            addMethodForm.reset();
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('active');
                addMethodForm.reset();
            }
        });

        addMethodForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const exampleValue = document.getElementById('methodExample').value;
            const newMethod = {
                type: document.getElementById('methodType').value,
                method: {
                    name: document.getElementById('methodName').value,
                    signature: document.getElementById('methodSignature').value,
                    description: document.getElementById('methodDescription').value,
                    returnType: document.getElementById('methodReturnType').value,
                    example: exampleValue || undefined,
                    origin: document.getElementById('methodOrigin').value
                }
            };
            
            let customMethods = [];
            const saved = localStorage.getItem('customMethods');
            if (saved) {
                customMethods = JSON.parse(saved);
            }
            customMethods.push(newMethod);
            localStorage.setItem('customMethods', JSON.stringify(customMethods));
            
            const collection = collectionsData.collections.find(c => c.type === newMethod.type);
            if (collection) {
                collection.methods.push(newMethod.method);
            } else {
                collectionsData.collections.push({
                    type: newMethod.type,
                    implementations: [],
                    methods: [newMethod.method]
                });
            }
            
            initializeTabs();
            renderCollections();
            
            modal.classList.remove('active');
            addMethodForm.reset();
            
            alert('Method added successfully!');
        });

        loadData();
    </script>
</body>
</html>
